<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pesquisa de Visitantes</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(135deg,#0d6efd,#6610f2);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            border:none;
            border-radius:20px;
            box-shadow:0 15px 40px rgba(0,0,0,.25);
        }

        .card-header{
            border-radius:20px 20px 0 0 !important;
            background:linear-gradient(90deg,#0dcaf0,#0d6efd);
        }

        textarea{
            resize:none;
        }

        .btn{
            width:130px;
        }

    </style>

</head>

<body>

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-7">

<div class="card">

<div class="card-header text-white text-center p-4">

<h2>Pesquisa de Visitantes</h2>

<p class="mb-0">Queremos conhecer melhor nossos visitantes.</p>

</div>

<div class="card-body p-4">

<form name="nomeform" onsubmit="return validarFormulario()">

<div class="mb-3">

<label class="form-label">Nome</label>

<input
type="text"
class="form-control"
placeholder="Digite seu nome">

</div>

<div class="mb-3">

<label class="form-label">E-mail</label>

<input
type="email"
class="form-control"
placeholder="email@exemplo.com">

</div>

<div class="mb-3">

<label class="form-label">Comentário</label>

<textarea
class="form-control"
rows="5"
placeholder="Conte para nós sua experiência..."></textarea>

</div>

<div class="mb-4">

<label class="form-label fw-bold">

É sua primeira visita?

</label>

<div class="form-check">

<input
class="form-check-input"
type="radio"
name="pesquisa"
value="sim">

<label class="form-check-label">

Sim

</label>

</div>

<div class="form-check">

<input
class="form-check-input"
type="radio"
name="pesquisa"
value="nao">

<label class="form-check-label">

Não

</label>

</div>

</div>

<div class="text-center">

<button class="btn btn-primary">
Enviar
</button>

<button type="reset" class="btn btn-outline-secondary">
Limpar
</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>


<script src="script.js"></script>
</body>
</html>
