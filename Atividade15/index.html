<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cursos Fatec Sorocaba</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="card shadow-lg">

        <div class="card-header text-center text-white">

            <h2>Cursos da Fatec Sorocaba</h2>

            <p>Escolha um curso para conhecer um pouco mais.</p>

        </div>

        <div class="card-body">

            <label class="form-label fw-bold">

                Selecione um curso

            </label>

            <select class="form-select" onchange="abrirCurso(this.value)">

                <option value="">Selecione...</option>

                <option value="ads.html">
                    Análise e Desenvolvimento de Sistemas
                </option>

                <option value="ads-ge.html">
                    ADS - Gestão Empresarial
                </option>

                <option value="logistica.html">
                    Logística
                </option>

                <option value="manufatura.html">
                    Manufatura Avançada
                </option>

                <option value="eletronica.html">
                    Eletrônica Automotiva
                </option>

                <option value="polimeros.html">
                    Polímeros
                </option>

                <option value="gestao.html">
                    Gestão da Produção Industrial
                </option>

            </select>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
